<!--
  El favicon de MiEvento.

  No es el logotipo reducido, y es deliberado: `MiEventoMark` dibuja su anillo con un trazo de
  1 unidad sobre un lienzo de 48 y las hojas de la guirnalda con 0.85. A 16x16 —el tamaño al
  que se ve de verdad una pestaña— eso son 0.33 px y 0.28 px. No se ven finos: se ven grises.
  Reducir el monograma no daría una versión pequeña de la marca, daría una mancha.

  Así que aquí sobrevive lo único que a ese tamaño todavía identifica algo: la letra y el
  color. Tres decisiones cuelgan de eso:

  1. **Va sobre un azulejo, no suelto.** Un trazo suelto depende del fondo de la pestaña, y ese
     fondo es blanco en un navegador y casi negro en otro. El azulejo trae su propio fondo, así
     que la marca se ve igual en los dos.
  2. **La letra va en crema y no en el oro de la marca.** El oro sobre berenjena da 4.9:1; la
     crema, 8.7:1. A 16 px una letra ya no es un adorno, es texto, y se aplica el mismo
     criterio que en `mievento.css`: el metal se queda en el monograma grande.
  3. **Trazo 4 y huecos de 4.** Es la proporción que hace legible un tipo diminuto: ojo y asta
     iguales. A 16 px son 2 px y 2 px, que es el mínimo por debajo del cual los dos huecos de
     la «m» se cierran y la letra se vuelve un bloque.

  La letra ocupa 20 de ancho por 17 de alto sobre el azulejo de 32 —unos seis de margen por
  lado—. Probado más pequeño, a 16 px sobra aire y la «m» se encoge hasta parecer un punto.

  El lienzo es de 32 para que 16 caiga en mitades exactas y la retícula no interpole.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#6b2d7b" />
  <path
    d="M8 23v-9a4 4 0 0 1 8 0 4 4 0 0 1 8 0v9M16 14v9"
    fill="none"
    stroke="#fdf6fc"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
